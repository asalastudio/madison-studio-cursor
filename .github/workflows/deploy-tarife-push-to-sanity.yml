# Deploy push-to-sanity after the Tarife host-mismatch fix lands on main.
# Frontend deploys do not publish Edge Functions, so production keeps serving
# the old function until this job succeeds.
# Requires the Production environment secret SUPABASE_ACCESS_TOKEN.
name: Deploy Tarife push-to-sanity

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/push-to-sanity/**"
      - "supabase/functions/_shared/sanityPublishTarget.ts"
      - ".github/workflows/deploy-tarife-push-to-sanity.yml"

concurrency:
  group: production-edge-functions
  cancel-in-progress: false

jobs:
  deploy-push-to-sanity:
    name: Deploy push-to-sanity
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Deploy push-to-sanity (preserve verify_jwt)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: likkskifwsrvszxdvufw
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not available to this workflow." >&2
            exit 1
          fi

          deployed_json="$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID")"
          verify_jwt="$(
            printf '%s' "$deployed_json" \
              | node -e '
                  let raw = "";
                  process.stdin.on("data", (chunk) => { raw += chunk; });
                  process.stdin.on("end", () => {
                    const found = raw.match(/"slug":"push-to-sanity"[\s\S]{0,600}?"verify_jwt":(true|false)/);
                    process.stdout.write(found ? found[1] : "new");
                  });
                '
          )"

          if [ "$verify_jwt" = "false" ]; then
            echo "Deploying push-to-sanity (preserving verify_jwt=false)"
            supabase functions deploy push-to-sanity --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          else
            echo "Deploying push-to-sanity (verify_jwt=${verify_jwt})"
            supabase functions deploy push-to-sanity --project-ref "$SUPABASE_PROJECT_ID"
          fi
          echo "push-to-sanity deployed."
