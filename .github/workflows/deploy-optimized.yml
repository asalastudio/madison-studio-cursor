name: Deploy Approved Supabase Edge Functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Space-separated function names from supabase/functions"
        required: true
        type: string
      confirm_production:
        description: "I approve deploying these named functions to production"
        required: true
        default: false
        type: boolean

concurrency:
  group: production-edge-functions
  cancel-in-progress: false

jobs:
  deploy-edge-functions:
    name: Deploy Named Edge Functions
    runs-on: ubuntu-latest
    if: inputs.confirm_production == true
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Validate deployment allowlist
        env:
          REQUESTED_FUNCTIONS: ${{ inputs.functions }}
        run: |
          set -euo pipefail
          if [ -z "${REQUESTED_FUNCTIONS// }" ]; then
            echo "At least one function name is required." >&2
            exit 1
          fi

          for func in $REQUESTED_FUNCTIONS; do
            case "$func" in
              *[!a-z0-9-]*|'')
                echo "Invalid function name: $func" >&2
                exit 1
                ;;
            esac
            if [ ! -f "supabase/functions/$func/index.ts" ]; then
              echo "Unknown function or missing index.ts: $func" >&2
              exit 1
            fi
          done

      # `supabase functions deploy` enables JWT verification unless told
      # otherwise, so redeploying a function that was deliberately deployed with
      # verify_jwt=false silently starts rejecting its callers with 401 — with
      # no error at deploy time and nothing in the diff to explain it. Five
      # functions are in that state today, including generate-madison-image.
      # Read the live setting per function and pass the flag back.
      - name: Deploy approved functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: likkskifwsrvszxdvufw
          REQUESTED_FUNCTIONS: ${{ inputs.functions }}
        run: |
          set -euo pipefail

          deployed_json="$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID")"

          for func in $REQUESTED_FUNCTIONS; do
            verify_jwt="$(
              printf '%s' "$deployed_json" \
                | node -e '
                    let raw = "";
                    process.stdin.on("data", (chunk) => { raw += chunk; });
                    process.stdin.on("end", () => {
                      const slug = process.argv[1];
                      const pattern = new RegExp(
                        `"slug":"${slug}"[\\s\\S]{0,600}?"verify_jwt":(true|false)`
                      );
                      const found = raw.match(pattern);
                      process.stdout.write(found ? found[1] : "new");
                    });
                  ' "$func"
            )"

            if [ "$verify_jwt" = "false" ]; then
              echo "Deploying $func (preserving verify_jwt=false)"
              supabase functions deploy "$func" --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
            else
              if [ "$verify_jwt" = "new" ]; then
                echo "Deploying $func (not currently deployed — creating with JWT verification)"
              else
                echo "Deploying $func (verify_jwt=true)"
              fi
              supabase functions deploy "$func" --project-ref "$SUPABASE_PROJECT_ID"
            fi
          done
          echo "All named Edge Functions deployed successfully."
