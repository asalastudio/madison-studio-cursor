<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Madison Video — previous cream project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #F5F1E8; --card: #FFFCF5; --ink: #1A1816; --muted: #2F2A26; --brass: #B8956A; --stone: #E5DFD1; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: Lato, sans-serif; }
      header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--stone); background: var(--card); }
      h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 22px; margin: 0; }
      main { display: grid; grid-template-columns: 280px 1fr 240px; min-height: calc(100vh - 56px); }
      aside { padding: 24px; border-right: 1px solid var(--stone); }
      .preview { display: flex; align-items: center; justify-content: center; padding: 32px; }
      .stage { width: min(720px, 100%); aspect-ratio: 16/9; background: #ddd6c6; border: 1px solid var(--stone); display: flex; align-items: center; justify-content: center; color: var(--muted); }
      .scenes { padding: 24px; border-left: 1px solid var(--stone); display: flex; flex-direction: column; gap: 12px; }
      .card { background: var(--card); border: 1px solid var(--stone); padding: 16px; }
      button { background: var(--brass); color: var(--card); border: 0; padding: 8px 14px; font-size: 13px; }
      label { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
      textarea { width: 100%; height: 88px; border: 1px solid var(--stone); background: var(--bg); padding: 8px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Video Project</h1>
      <span>15s · Instagram</span>
    </header>
    <main>
      <aside>
        <label>Prompt</label>
        <textarea>Create a 15 second product ad</textarea>
        <div class="card" style="margin-top:16px">
          <label>Scenes</label>
          <div>1. Hook</div>
          <div>2. Product</div>
          <div>3. CTA</div>
        </div>
        <button style="margin-top:16px;width:100%">Generate variations</button>
      </aside>
      <section class="preview"><div class="stage">Scene preview</div></section>
      <aside class="scenes">
        <div class="card">Variation A</div>
        <div class="card">Variation B</div>
        <div class="card">Variation C</div>
      </aside>
    </main>
  </body>
</html>
